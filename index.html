<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة اللسانيات - الواجهة الرئيسة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* المتغيرات اللونية (تدرجات البني) */
        :root {
            --primary-color: #5D4037;    
            --secondary-color: #8D6E63;  
            --accent-color: #D7CCC8;     
            --bg-color: #F8F6F4;         
            --card-bg: rgba(255, 255, 255, 0.85); 
            --text-dark: #3E2723;        
            --text-light: #FFFFFF;       
        }

        /* الإعدادات العامة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* شريط التنقل العلوي */
        header {
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 1.2rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(93, 64, 55, 0.15);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
        }

        .logo i {
            color: var(--accent-color);
        }

        .time-badge {
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 12px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        /* الحاوية الرئيسية للشبكة (GRID) */
        .main-container {
            flex: 1;
            max-width: 1300px;
            margin: 0 auto;
            padding: 4rem 2rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .page-header h1 {
            font-size: 2.4rem;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .page-header p {
            color: var(--secondary-color);
            font-size: 1.1rem;
        }

        /* إعدادات الـ GRID للبطاقات - تم التعديل لتصبح 2x2 بشكل دائم على الشاشات الكبيرة */
        .grid-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            width: 100%;
            max-width: 900px; /* لضبط العرض وجعل المربعات متناسقة أكثر */
            margin: 0 auto;
        }

        /* تصميم البطاقة الاحترافية */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(141, 110, 99, 0.15);
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 8px 24px rgba(93, 64, 55, 0.04);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1; /* لجعل البطاقة مربعة الشكل تماماً كالصورة المرجعية */
        }

        /* تأثير ممتد عند تحويم الفأرة */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--secondary-color);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 36px rgba(93, 64, 55, 0.12);
            background: #FFFFFF;
            border-color: var(--secondary-color);
        }

        /* تنسيق الأيقونات الاحترافية */
        .icon-box {
            width: 80px;
            height: 80px;
            background-color: rgba(141, 110, 99, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            transition: all 0.3s ease;
        }

        .card:hover .icon-box { 
            background-color: var(--primary-color);
        }

        .card i {
            font-size: 2.5rem;
            color: var(--primary-color);
            transition: color 0.3s ease;
        }

        .card:hover i {
            color: var(--secondary-color);
        }

        /* نصوص البطاقة */
        .card h3 {
            font-size: 1.8rem; /* تم تكبير الخط قليلاً لملء الفراغ بعد الحذف */
            color: var(--primary-color);
            margin-bottom: 0;
            font-weight: 600;
        }

        /* التذييل السفلي */
        footer {
            background-color: var(--primary-color);
            color: var(--text-light);
            text-align: center;
            padding: 1.5rem;
            font-size: 0.95rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* التجاوب مع الشاشات الصغيرة (الجوال) */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 1.2rem 1rem;
                text-align: center;
            }
            .main-container {
                padding: 2rem 1.5rem;
            }
            .page-header {
                margin-bottom: 2.5rem;
            }
            .page-header h1 {
                font-size: 1.8rem;
            }
            .page-header p {
                font-size: 1rem;
            }
            .grid-wrapper {
                /* إجبار البطاقات على الظهور في عمود واحد في الجوال للحفاظ على التصميم */
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .card {
                padding: 2rem 1.5rem;
                aspect-ratio: auto;
                min-height: 200px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            منصة اللسانيات
        </div>
        <div class="time-badge">البوابة المعرفية الرئيسية</div>
    </header>

    <main class="main-container">
        
        <div class="page-header">
            <h1>مرحباً بك في منصة اللسانيات</h1>
            <p>اختر أحد الأقسام التخصصية للبدء في تصفح المحتوى اللغوي</p>
        </div>

        <div class="grid-wrapper">
            
            <div class="card" onclick="navigateTo('lessons')">
                <div class="icon-box">
                    <i class="fa-solid fa-book-open-reader"></i>
                </div>
                <h3>الدروس</h3>
            </div>

            <div class="card" onclick="navigateTo('enrichment')">
                <div class="icon-box">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <h3>المعلومات الإثرائية</h3>
            </div>

            <div class="card" onclick="navigateTo('references')">
                <div class="icon-box">
                    <i class="fa-solid fa-scroll"></i>
                </div>
                <h3>المصادر والمراجع</h3>
            </div>

            <div class="card" onclick="navigateTo('scholars')">
                <div class="icon-box">
                    <i class="fa-solid fa-signature"></i>
                </div>
                <h3>شخصيات لسانية</h3>
            </div>

        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 | منصة اللسانيات</p>
    </footer>

    <script>
        function navigateTo(sectionId) {
            console.log("الانتقال إلى المعرف الداخلي للقسم الخاص بـ: " + sectionId);
        }
    </script>
</body>
</html>
